<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bathroom Configurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-new { background-color: #dbeafe; color: #1e40af; }
        .status-contacted { background-color: #fef3c7; color: #92400e; }
        .status-qualified { background-color: #d1fae5; color: #065f46; }
        .status-closed { background-color: #e5e7eb; color: #1f2937; }

        .lead-score-high { color: #059669; font-weight: bold; }
        .lead-score-medium { color: #d97706; font-weight: bold; }
        .lead-score-low { color: #6b7280; font-weight: bold; }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-card:nth-child(4) {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-chart-line text-blue-600 mr-2"></i>
                        Admin Dashboard
                    </h1>
                    <a href="index.html" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Configurator
                    </a>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <section id="analyticsSection" class="mb-8">
                <h2 class="text-xl font-bold text-gray-900 mb-4">
                    <i class="fas fa-chart-bar text-blue-600 mr-2"></i>
                    Analytics Overview
                </h2>
                <div id="analyticsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm opacity-90">Total Leads</p>
                                <p id="totalLeads" class="text-3xl font-bold mt-1">-</p>
                            </div>
                            <i class="fas fa-users text-4xl opacity-50"></i>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm opacity-90">Total Analyses</p>
                                <p id="totalSpecs" class="text-3xl font-bold mt-1">-</p>
                            </div>
                            <i class="fas fa-search text-4xl opacity-50"></i>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm opacity-90">Total Renders</p>
                                <p id="totalRenders" class="text-3xl font-bold mt-1">-</p>
                            </div>
                            <i class="fas fa-image text-4xl opacity-50"></i>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm opacity-90">Conversion Rate</p>
                                <p id="conversionRate" class="text-3xl font-bold mt-1">-</p>
                            </div>
                            <i class="fas fa-percentage text-4xl opacity-50"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="fas fa-star text-yellow-500 mr-2"></i>
                        Popular Styles
                    </h3>
                    <div id="popularStyles" class="space-y-3">
                    </div>
                </div>
            </section>

            <section id="leadsSection">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-gray-900">
                        <i class="fas fa-list text-blue-600 mr-2"></i>
                        Leads Management
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="filterLeads('all')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                            All
                        </button>
                        <button onclick="filterLeads('new')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                            New
                        </button>
                        <button onclick="filterLeads('contacted')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                            Contacted
                        </button>
                        <button onclick="filterLeads('qualified')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                            Qualified
                        </button>
                        <button onclick="exportLeads()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700">
                            <i class="fas fa-download mr-2"></i>Export CSV
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div id="leadsLoader" class="p-8 text-center">
                        <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
                        <p class="text-gray-600 mt-2">Loading leads...</p>
                    </div>
                    <div id="leadsTable" class="hidden overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lead Info</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Project Details</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="leadsTableBody" class="bg-white divide-y divide-gray-200">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:8000' : window.location.origin;
        let allLeads = [];
        let currentFilter = 'all';

        async function loadAnalytics() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/analytics`);
                const data = await response.json();

                if (data.success) {
                    const analytics = data.analytics;

                    document.getElementById('totalLeads').textContent = analytics.total_leads;
                    document.getElementById('totalSpecs').textContent = analytics.total_specs;
                    document.getElementById('totalRenders').textContent = analytics.total_renders;
                    document.getElementById('conversionRate').textContent = `${analytics.conversion_rate}%`;

                    const stylesHTML = analytics.popular_styles.map(s => `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <i class="fas fa-palette text-blue-500 mr-3"></i>
                                <span class="font-medium capitalize text-gray-700">${s.style}</span>
                            </div>
                            <span class="text-gray-900 font-bold">${s.count}</span>
                        </div>
                    `).join('');

                    document.getElementById('popularStyles').innerHTML = stylesHTML || '<p class="text-gray-500 text-sm">No data yet</p>';
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        async function loadLeads(status = null) {
            try {
                const url = status && status !== 'all'
                    ? `${API_BASE_URL}/api/admin/leads?status=${status}`
                    : `${API_BASE_URL}/api/admin/leads`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    allLeads = data.leads;
                    displayLeads(allLeads);
                }

                document.getElementById('leadsLoader').classList.add('hidden');
                document.getElementById('leadsTable').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading leads:', error);
                document.getElementById('leadsLoader').innerHTML = `
                    <i class="fas fa-exclamation-circle text-3xl text-red-600"></i>
                    <p class="text-gray-600 mt-2">Error loading leads</p>
                `;
            }
        }

        function displayLeads(leads) {
            const tbody = document.getElementById('leadsTableBody');

            if (leads.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>No leads found</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = leads.map(lead => {
                const date = new Date(lead.created_at).toLocaleDateString();
                const time = new Date(lead.created_at).toLocaleTimeString();
                const timeline = lead.metadata?.project_timeline || 'Not specified';
                const area = lead.spec_json?.room ?
                    (lead.spec_json.room.length * lead.spec_json.room.width).toFixed(1) + 'm²' :
                    'N/A';

                return `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${lead.name}</div>
                            <div class="text-xs text-gray-500">${date} ${time}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm text-gray-900">${lead.email}</div>
                            <div class="text-sm text-gray-500">${lead.phone || 'N/A'}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm text-gray-900">Timeline: ${timeline}</div>
                            <div class="text-sm text-gray-500">Area: ${area}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="lead-score-${lead.lead_score || 'medium'}">${(lead.lead_score || 'medium').toUpperCase()}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <select
                                class="status-badge status-${lead.status}"
                                onchange="updateLeadStatus('${lead.id}', this.value)"
                            >
                                <option value="new" ${lead.status === 'new' ? 'selected' : ''}>New</option>
                                <option value="contacted" ${lead.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="qualified" ${lead.status === 'qualified' ? 'selected' : ''}>Qualified</option>
                                <option value="closed" ${lead.status === 'closed' ? 'selected' : ''}>Closed</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            ${lead.render_url ? `<a href="${lead.render_url}" target="_blank" class="text-blue-600 hover:text-blue-800 mr-3"><i class="fas fa-image"></i></a>` : ''}
                            <a href="mailto:${lead.email}" class="text-blue-600 hover:text-blue-800"><i class="fas fa-envelope"></i></a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateLeadStatus(leadId, newStatus) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/leads/${leadId}/status?status=${newStatus}`, {
                    method: 'PUT'
                });

                const data = await response.json();

                if (data.success) {
                    await loadLeads(currentFilter === 'all' ? null : currentFilter);
                    showToast('Lead status updated successfully', 'success');
                } else {
                    showToast('Failed to update lead status', 'error');
                }
            } catch (error) {
                console.error('Error updating lead status:', error);
                showToast('Error updating lead status', 'error');
            }
        }

        function filterLeads(status) {
            currentFilter = status;
            loadLeads(status === 'all' ? null : status);
        }

        function exportLeads() {
            if (allLeads.length === 0) {
                showToast('No leads to export', 'error');
                return;
            }

            const csvContent = [
                ['Name', 'Email', 'Phone', 'Timeline', 'Lead Score', 'Status', 'Created At'].join(','),
                ...allLeads.map(lead => [
                    lead.name,
                    lead.email,
                    lead.phone || '',
                    lead.metadata?.project_timeline || '',
                    lead.lead_score || '',
                    lead.status,
                    new Date(lead.created_at).toISOString()
                ].join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `leads-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);

            showToast('Leads exported successfully', 'success');
        }

        function showToast(message, type = 'success') {
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-4 rounded-lg shadow-lg z-50`;
            toast.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${icon} mr-3 text-xl"></i>
                    <p>${message}</p>
                </div>
            `;

            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.updateLeadStatus = updateLeadStatus;
        window.filterLeads = filterLeads;
        window.exportLeads = exportLeads;

        loadAnalytics();
        loadLeads();
    </script>
</body>
</html>
